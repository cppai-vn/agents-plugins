name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate marketplace
        run: claude plugin validate . --strict
      - name: Validate plugins
        run: |
          for manifest in */.claude-plugin/plugin.json; do
            claude plugin validate "$(dirname "$(dirname "$manifest")")" --strict
          done
      - name: Cursor marketplace and manifests match Claude's
        run: |
          python - <<'EOF'
          import json
          names = lambda path: sorted(p['name'] for p in json.load(open(path))['plugins'])
          claude, cursor = names('.claude-plugin/marketplace.json'), names('.cursor-plugin/marketplace.json')
          if claude != cursor:
              raise SystemExit(f'.cursor-plugin/marketplace.json lists {cursor}, .claude-plugin/marketplace.json lists {claude}')
          for entry in json.load(open('.cursor-plugin/marketplace.json'))['plugins']:
              manifest = f"{entry['source']}/.cursor-plugin/plugin.json"
              name = json.load(open(manifest))['name']
              if name != entry['name']:
                  raise SystemExit(f"{manifest} is named {name}, marketplace entry is {entry['name']}")
          EOF
      - name: Check Python scripts compile
        run: python -m compileall -q .
      - name: Every plugin version is bumped in its CHANGELOG
        run: |
          for manifest in */.claude-plugin/plugin.json; do
            dir=$(dirname "$(dirname "$manifest")")
            version=$(python -c "import json,sys; print(json.load(open(sys.argv[1]))['version'])" "$manifest")
            grep -q "^## $version" "$dir/CHANGELOG.md" || { echo "$dir: version $version missing in CHANGELOG.md"; exit 1; }
          done
